# Example for libraries.toml, which groups courses into libraries.
# The Libraries page in Spectre Studio can make this file for you. To make it by hand:
# Copy this file, name the copy libraries.toml, and list your own courses.
# libraries.toml stays out of Git, because it shows your course names.
#
# After a hand edit, reopen Spectre Studio or click Update index to see your changes.
# Saving on the Libraries page rewrites the file, so comments in it are lost.
# Removing a library here only removes the grouping. Your notes and index stay.

[[library]]
# A permanent ID: lowercase letters, digits and hyphens. Don't change it later.
id = "automotive"
# The name you see. You can change it at any time.
name = "Automotive"
# Optional. The app's own categories have their own icon and color.
category = "Engineering & Trades"
# Optional. One line, up to 160 characters.
description = "Brakes, check engine codes and other shop notes."
# Course folder names, exactly as they appear under notes.
courses = ["AUTO-101"]
